<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бонд — Задачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================
   KANBAN BOARD — GLASSMORPHISM THEME
   Modern animated gradient + frosted glass
   ============================================ */

/* ===== CSS CUSTOM PROPERTIES ===== */
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;

  --bg-gradient-1: #667eea;
  --bg-gradient-2: #764ba2;
  --bg-gradient-3: #6B73FF;
  --bg-gradient-4: #000DFF;

  --column-bg: rgba(255, 255, 255, 0.75);
  --column-blur: 16px;
  --card-bg: rgba(255, 255, 255, 0.9);
  --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  --card-hover-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  --card-border-radius: 12px;
  --column-border-radius: 16px;

  --text-primary: #1e1b4b;
  --text-secondary: #64748b;
  --text-hint: #94a3b8;

  --header-bg: rgba(255, 255, 255, 0.15);
  --header-blur: 20px;

  --modal-bg: rgba(255, 255, 255, 0.92);
  --overlay-bg: rgba(15, 12, 41, 0.6);

  --column-header-color: #1e1b4b;
  --btn-add-color: #64748b;
  --btn-add-hover: #1e1b4b;

  --label-green: #22c55e;
  --label-yellow: #eab308;
  --label-orange: #f97316;
  --label-red: #ef4444;
  --label-purple: #a855f7;
  --label-blue: #6366f1;

  --input-bg: rgba(255, 255, 255, 0.8);
  --input-border: rgba(99, 102, 241, 0.2);
  --input-focus-border: var(--primary);
  --input-focus-ring: rgba(99, 102, 241, 0.25);

  --toast-bg: rgba(30, 27, 75, 0.92);
  --toast-color: #ffffff;

  --confirm-bg: rgba(255, 255, 255, 0.95);
  --confirm-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

  --scrollbar-thumb: rgba(99, 102, 241, 0.25);
  --scrollbar-thumb-hover: rgba(99, 102, 241, 0.4);

  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;

  --progress-bar-bg: linear-gradient(90deg, #22c55e, #6366f1, #a855f7);

  --accent-col-1: linear-gradient(90deg, #6366f1, #818cf8);
  --accent-col-2: linear-gradient(90deg, #f59e0b, #fbbf24);
  --accent-col-3: linear-gradient(90deg, #22c55e, #4ade80);

  --filter-pill-bg: rgba(255, 255, 255, 0.6);
  --filter-pill-active: var(--primary);

  --archive-bg: rgba(255, 255, 255, 0.92);

  --stats-bar-bg: rgba(99, 102, 241, 0.15);
  --stats-bar-fill: var(--primary);
}

/* ===== DARK MODE ===== */
body.dark {
  --bg-gradient-1: #0f0c29;
  --bg-gradient-2: #302b63;
  --bg-gradient-3: #24243e;
  --bg-gradient-4: #0f0c29;

  --column-bg: rgba(30, 30, 50, 0.8);
  --card-bg: rgba(40, 40, 65, 0.85);
  --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  --card-hover-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-hint: #64748b;

  --header-bg: rgba(15, 12, 41, 0.5);

  --modal-bg: rgba(30, 30, 50, 0.95);
  --overlay-bg: rgba(0, 0, 0, 0.7);

  --column-header-color: #e2e8f0;
  --btn-add-color: #94a3b8;
  --btn-add-hover: #e2e8f0;

  --input-bg: rgba(40, 40, 65, 0.8);
  --input-border: rgba(99, 102, 241, 0.3);

  --toast-bg: rgba(40, 40, 65, 0.95);

  --confirm-bg: rgba(30, 30, 50, 0.95);
  --confirm-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

  --scrollbar-thumb: rgba(148, 163, 184, 0.2);
  --scrollbar-thumb-hover: rgba(148, 163, 184, 0.35);

  --filter-pill-bg: rgba(40, 40, 65, 0.6);

  --archive-bg: rgba(30, 30, 50, 0.95);

  --stats-bar-bg: rgba(99, 102, 241, 0.2);
}

/* ===== KEYFRAME ANIMATIONS ===== */
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  25% { background-position: 50% 100%; }
  50% { background-position: 100% 50%; }
  75% { background-position: 50% 0%; }
  100% { background-position: 0% 50%; }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes confetti {
  0% {
    opacity: 1;
    transform: translateY(0) rotate(0deg) scale(1);
  }
  50% {
    opacity: 0.8;
  }
  100% {
    opacity: 0;
    transform: translateY(-120px) rotate(720deg) scale(0);
  }
}

@keyframes slideInRight {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@keyframes progressPulse {
  0%, 100% {
    box-shadow: 0 0 4px rgba(99, 102, 241, 0.3);
  }
  50% {
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6), 0 0 24px rgba(99, 102, 241, 0.3);
  }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes bottomSheetIn {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

/* ===== RESET & BASE ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font);
  background: linear-gradient(
    -45deg,
    var(--bg-gradient-1),
    var(--bg-gradient-2),
    var(--bg-gradient-3),
    var(--bg-gradient-4)
  );
  background-size: 400% 400%;
  animation: gradientShift 45s ease infinite;
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

/* ===== GLOBAL SCROLLBAR ===== */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
}

/* ===== HEADER ===== */
.header {
  background: var(--header-bg);
  backdrop-filter: saturate(180%) blur(var(--header-blur));
  -webkit-backdrop-filter: saturate(180%) blur(var(--header-blur));
  padding: 0 12px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: env(safe-area-inset-top, 0);
}

.header-board-name {
  font-size: 17px;
  font-weight: 700;
  color: #ffffff;
  padding: 0 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 80px;
  letter-spacing: -0.01em;
}

/* ===== PROGRESS BAR (below header) ===== */
.progress-bar-container {
  height: 3px;
  background: rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--progress-bar-bg);
  background-size: 200% 100%;
  border-radius: 0 3px 3px 0;
  transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  animation: progressPulse 3s ease-in-out infinite;
}

/* ===== DARK MODE TOGGLE ===== */
.dark-mode-toggle {
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: #ffffff;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.2s;
}
.dark-mode-toggle:hover {
  background: rgba(255, 255, 255, 0.25);
}
.dark-mode-toggle:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.3);
}

/* ===== HEADER SEARCH ===== */
.header-search {
  flex: 1;
  max-width: 220px;
  position: relative;
  display: flex;
  align-items: center;
}
.header-search-icon {
  position: absolute;
  left: 10px;
  font-size: 13px;
  color: var(--text-hint);
  pointer-events: none;
  z-index: 1;
}
.header-search input {
  width: 100%;
  padding: 7px 30px 7px 32px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.header-search input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}
.header-search input:focus {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}
.header-search-clear {
  position: absolute;
  right: 6px;
  background: none;
  border: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.6);
  transition: background 0.15s, color 0.15s;
}
.header-search-clear:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
}
.header-search-clear.visible {
  display: flex;
}

/* ===== HEADER BUTTONS ===== */
.header-btn {
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: #ffffff;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.2s;
}
.header-btn:hover {
  background: rgba(255, 255, 255, 0.25);
}
.header-btn:active {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(0.92);
}

/* ===== SYNC INDICATOR ===== */
.sync-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  transition: background 0.3s;
  margin-right: 4px;
  flex-shrink: 0;
}
.sync-indicator.syncing {
  background: var(--warning);
  animation: pulse 1s infinite;
}

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 6px 12px;
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar {
  display: none;
}
.filter-pill {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: var(--filter-pill-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s;
  min-height: 44px;
  display: flex;
  align-items: center;
}
.filter-pill:active {
  transform: scale(0.95);
}
.filter-pill.active {
  background: var(--filter-pill-active);
  color: #ffffff;
  border-color: transparent;
}

/* ===== BOARD TABS ===== */
.board-tabs {
  background: rgba(0, 0, 0, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  height: 42px;
  flex-shrink: 0;
  padding: 0 6px;
  gap: 4px;
  align-items: stretch;
}
.board-tab {
  flex: 1;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.6);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 8px 8px 0 0;
  transition: background 0.2s, color 0.2s;
  position: relative;
  padding: 0 14px;
}
.board-tab.active {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
}
.board-tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 10px;
  right: 10px;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: #ffffff;
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.board-tab.active::after {
  transform: scaleX(1);
}
.board-tab:active {
  background: rgba(255, 255, 255, 0.18);
}

.tab-badge {
  background: rgba(255, 255, 255, 0.2);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  min-width: 20px;
  text-align: center;
}
.board-tab.active .tab-badge {
  background: rgba(255, 255, 255, 0.3);
}

/* ===== BOARD — horizontal scroll ===== */
.board {
  flex: 1;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 6px 10px 10px;
  gap: 10px;
  align-items: flex-start;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.board::-webkit-scrollbar { height: 6px; }
.board::-webkit-scrollbar-track { background: transparent; }
.board::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 3px;
}

/* ===== COLUMN ===== */
.column {
  flex: 0 0 280px;
  max-width: 280px;
  min-width: 280px;
  background: var(--column-bg);
  backdrop-filter: blur(var(--column-blur));
  -webkit-backdrop-filter: blur(var(--column-blur));
  border-radius: var(--column-border-radius);
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 120px);
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.4s ease both;
}

/* Column top accent bar */
.column::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: var(--column-border-radius) var(--column-border-radius) 0 0;
}
.column:nth-child(1)::before { background: var(--accent-col-1); }
.column:nth-child(2)::before { background: var(--accent-col-2); }
.column:nth-child(3)::before { background: var(--accent-col-3); }
.column:nth-child(4)::before { background: linear-gradient(90deg, #ef4444, #f97316); }
.column:nth-child(5)::before { background: linear-gradient(90deg, #a855f7, #ec4899); }

/* Staggered column entrance */
.column:nth-child(1) { animation-delay: 0s; }
.column:nth-child(2) { animation-delay: 0.08s; }
.column:nth-child(3) { animation-delay: 0.16s; }
.column:nth-child(4) { animation-delay: 0.24s; }
.column:nth-child(5) { animation-delay: 0.32s; }

@media (max-width: 600px) {
  .column {
    flex: 0 0 calc(100vw - 24px);
    max-width: calc(100vw - 24px);
    min-width: calc(100vw - 24px);
    scroll-snap-align: center;
  }
  .board {
    scroll-snap-type: x mandatory;
    padding: 10px 8px 10px 12px;
  }
}

.column-header {
  padding: 12px 12px 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  cursor: default;
}
.column-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--column-header-color);
  flex: 1;
  padding: 2px 4px;
  line-height: 1.4;
  letter-spacing: -0.01em;
}
.column-count {
  font-size: 11px;
  color: var(--text-secondary);
  background: rgba(99, 102, 241, 0.1);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

.column-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 6px 6px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.column-body::-webkit-scrollbar { width: 4px; }
.column-body::-webkit-scrollbar-track { background: transparent; }
.column-body::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 2px;
}

/* ===== ADD CARD BUTTON ===== */
.add-card-btn {
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  border-radius: 0 0 var(--column-border-radius) var(--column-border-radius);
  color: var(--btn-add-color);
  font-size: 14px;
  font-family: var(--font);
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background 0.15s, color 0.15s;
  min-height: 44px;
}
.add-card-btn:hover,
.add-card-btn:active {
  background: rgba(99, 102, 241, 0.08);
  color: var(--btn-add-hover);
}
.add-card-btn .plus {
  font-size: 18px;
  line-height: 1;
  font-weight: 400;
}

/* ===== CARD ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--card-border-radius);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: var(--card-shadow);
  padding: 10px 12px 8px;
  margin-bottom: 8px;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.15s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
  animation: fadeInUp 0.3s ease both;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* Staggered card entrance animations */
.card:nth-child(2) { animation-delay: 0.03s; }
.card:nth-child(3) { animation-delay: 0.06s; }
.card:nth-child(4) { animation-delay: 0.09s; }
.card:nth-child(5) { animation-delay: 0.12s; }
.card:nth-child(6) { animation-delay: 0.15s; }
.card:nth-child(7) { animation-delay: 0.18s; }
.card:nth-child(8) { animation-delay: 0.21s; }
.card:nth-child(9) { animation-delay: 0.24s; }
.card:nth-child(10) { animation-delay: 0.27s; }

.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-hover-shadow);
}
.card:active {
  transform: translateY(0) scale(0.98);
}
.card.dragging {
  opacity: 0.6;
  transform: rotate(3deg) scale(1.03);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
  z-index: 1000;
}

body.dark .card {
  border-color: rgba(255, 255, 255, 0.08);
}

/* ===== CARD LABELS — Pill shaped ===== */
.card-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.card-label {
  width: 40px;
  height: 6px;
  border-radius: 3px;
  flex-shrink: 0;
  transition: width 0.2s, height 0.2s;
}
.card:hover .card-label {
  height: 8px;
}
.card-label.green { background: var(--label-green); }
.card-label.yellow { background: var(--label-yellow); }
.card-label.orange { background: var(--label-orange); }
.card-label.red { background: var(--label-red); }
.card-label.purple { background: var(--label-purple); }
.card-label.blue { background: var(--label-blue); }

.card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.45;
  word-wrap: break-word;
}

.card-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.card-badge {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  color: var(--text-secondary);
}
.card-badge svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
  flex-shrink: 0;
}

.card-move-btns {
  display: flex;
  gap: 2px;
  margin-left: auto;
}
.card-move-btn {
  background: rgba(99, 102, 241, 0.06);
  border: none;
  border-radius: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
  min-width: 44px;
  min-height: 44px;
  /* Ensure touch target is big enough visually */
  min-width: 26px;
  min-height: 26px;
}
.card-move-btn:hover {
  background: rgba(99, 102, 241, 0.12);
  color: var(--primary);
}
.card-move-btn:active {
  background: rgba(99, 102, 241, 0.2);
}

/* ===== DROP ZONE ===== */
.drop-zone {
  min-height: 2px;
  border: 2px dashed transparent;
  border-radius: var(--card-border-radius);
  transition: all 0.2s;
  margin-bottom: 2px;
}
.drop-zone.active {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.08);
  min-height: 48px;
  border-radius: var(--card-border-radius);
}

/* ===== COLUMN DOTS (mobile) ===== */
.column-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 6px 0;
  flex-shrink: 0;
}
@media (min-width: 601px) { .column-dots { display: none; } }
.cdot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.cdot.active {
  background: #ffffff;
  transform: scale(1.6);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 24px 12px;
  color: var(--text-secondary);
}
.empty-state .icon {
  font-size: 28px;
  margin-bottom: 8px;
  opacity: 0.5;
}
.empty-state p {
  font-size: 13px;
  line-height: 1.5;
}

/* ===== MODAL OVERLAY ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 500;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s, visibility 0.25s;
}
.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* ===== MODAL — Bottom Sheet with Spring ===== */
.modal {
  background: var(--modal-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-bottom: none;
  width: 100%;
  max-width: 500px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.modal-overlay.active .modal {
  transform: translateY(0);
}
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 2px;
}

/* Modal drag handle */
.modal::before {
  content: '';
  display: block;
  width: 36px;
  height: 4px;
  background: rgba(128, 128, 128, 0.3);
  border-radius: 2px;
  margin: 8px auto 0;
}

.modal-header {
  padding: 16px 16px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid rgba(99, 102, 241, 0.1);
  background: transparent;
  border-radius: 20px 20px 0 0;
}
.modal-header-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  flex-shrink: 0;
  font-size: 16px;
  margin-top: 2px;
  background: rgba(99, 102, 241, 0.1);
  border-radius: 8px;
}
.modal-header-content { flex: 1; }
.modal-title-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
}
.modal-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 3px;
}
.modal-close-btn {
  background: rgba(99, 102, 241, 0.08);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: background 0.15s, transform 0.15s;
  flex-shrink: 0;
}
.modal-close-btn:hover {
  background: rgba(99, 102, 241, 0.15);
}
.modal-close-btn:active {
  background: rgba(99, 102, 241, 0.2);
  transform: scale(0.9);
}

.modal-body { padding: 0; }

/* ===== FORM SECTIONS ===== */
.form-section {
  padding: 14px 16px;
  background: transparent;
  margin-bottom: 0;
  border-bottom: 1px solid rgba(99, 102, 241, 0.06);
}
.form-section:last-child {
  border-bottom: none;
}
.form-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}
.form-section input,
.form-section textarea {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--input-border);
  border-radius: 10px;
  background: var(--input-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.form-section input:focus,
.form-section textarea:focus {
  border-color: var(--input-focus-border);
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 0 4px var(--input-focus-ring);
}
body.dark .form-section input:focus,
body.dark .form-section textarea:focus {
  background: rgba(40, 40, 65, 0.95);
}
.form-section textarea {
  min-height: 80px;
  resize: vertical;
}
.form-section input::placeholder,
.form-section textarea::placeholder {
  color: var(--text-hint);
}

/* Due date input */
.form-section input[type="date"] {
  appearance: none;
  -webkit-appearance: none;
  padding: 10px 14px;
  cursor: pointer;
}
.form-section input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  opacity: 0.6;
  filter: var(--date-icon-filter, none);
}
body.dark .form-section input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
}

/* ===== SUBTASKS ===== */
.subtasks-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.subtask-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 8px;
  transition: background 0.15s;
  min-height: 44px;
}
.subtask-item:hover {
  background: rgba(99, 102, 241, 0.05);
}
.subtask-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
  flex-shrink: 0;
  border-radius: 4px;
}
.subtask-item label {
  font-size: 14px;
  color: var(--text-primary);
  cursor: pointer;
  flex: 1;
  line-height: 1.4;
  transition: color 0.2s, text-decoration-color 0.2s;
}
.subtask-item input[type="checkbox"]:checked + label {
  text-decoration: line-through;
  color: var(--text-hint);
}
.subtask-add {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.subtask-add input {
  flex: 1;
}
.subtask-add button {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: var(--primary);
  color: #ffffff;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
  min-height: 44px;
}
.subtask-add button:active {
  opacity: 0.7;
}

/* ===== LABELS PICKER ===== */
.labels-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.label-chip {
  width: 44px;
  height: 28px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.label-chip:active { transform: scale(0.9); }
.label-chip.selected {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
}
.label-chip.selected::after {
  content: '\2713';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}
.label-chip.green { background: var(--label-green); }
.label-chip.yellow { background: var(--label-yellow); }
.label-chip.orange { background: var(--label-orange); }
.label-chip.red { background: var(--label-red); }
.label-chip.purple { background: var(--label-purple); }
.label-chip.blue { background: var(--label-blue); }

/* ===== PRIORITY PICKER ===== */
.priority-picker {
  display: flex;
  gap: 8px;
}
.priority-btn {
  flex: 1;
  padding: 10px 6px;
  border: 2px solid var(--input-border);
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  text-align: center;
  min-height: 44px;
}
.priority-btn:active { transform: scale(0.96); }
.priority-btn.selected {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.1);
  color: var(--primary);
  font-weight: 700;
}

/* ===== COLUMN PICKER ===== */
.column-picker {
  display: flex;
  gap: 6px;
}
.col-pick-btn {
  flex: 1;
  padding: 10px 4px;
  border: 2px solid var(--input-border);
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 44px;
}
.col-pick-btn:active { transform: scale(0.96); }
.col-pick-btn.selected {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.1);
  color: var(--primary);
  font-weight: 700;
}

/* ===== MODAL ACTIONS ===== */
.modal-actions {
  display: flex;
  gap: 8px;
  padding: 14px 16px 10px;
  background: transparent;
}
.modal-actions button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
  min-height: 44px;
}
.modal-actions button:active {
  opacity: 0.7;
  transform: scale(0.97);
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}
.btn-secondary {
  background: rgba(99, 102, 241, 0.06);
  color: var(--text-primary);
  border: 1px solid var(--input-border) !important;
}
.btn-danger {
  background: linear-gradient(135deg, var(--danger), #dc2626);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s, visibility 0.25s;
  padding: 20px;
}
.confirm-overlay.active { opacity: 1; visibility: visible; }
.confirm-box {
  background: var(--confirm-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 24px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow: var(--confirm-shadow);
  transform: scale(0.9) translateY(10px);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
.confirm-overlay.active .confirm-box {
  transform: scale(1) translateY(0);
}
.confirm-box h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.confirm-box p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.5;
}
.confirm-box .btns { display: flex; gap: 8px; }
.confirm-box .btns button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
  min-height: 44px;
}
.confirm-box .btns button:active {
  opacity: 0.7;
  transform: scale(0.97);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--toast-color);
  padding: 10px 24px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 14px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast-icon {
  font-size: 16px;
  flex-shrink: 0;
}

/* ===== STATISTICS PANEL ===== */
.stats-panel {
  background: var(--column-bg);
  backdrop-filter: blur(var(--column-blur));
  -webkit-backdrop-filter: blur(var(--column-blur));
  border-radius: var(--column-border-radius);
  border: 1px solid rgba(255, 255, 255, 0.2);
  margin: 0 12px 10px;
  overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.stats-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  min-height: 44px;
}
.stats-header h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}
.stats-toggle-icon {
  color: var(--text-secondary);
  font-size: 12px;
  transition: transform 0.3s;
}
.stats-panel.open .stats-toggle-icon {
  transform: rotate(180deg);
}
.stats-body {
  padding: 0 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stats-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.stats-row-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  min-width: 80px;
  flex-shrink: 0;
}
.stats-bar {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: var(--stats-bar-bg);
  overflow: hidden;
}
.stats-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--stats-bar-fill);
  transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.stats-bar-fill.success { background: var(--success); }
.stats-bar-fill.warning { background: var(--warning); }
.stats-bar-fill.danger { background: var(--danger); }
.stats-row-value {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-primary);
  min-width: 28px;
  text-align: right;
}

/* ===== ARCHIVE PANEL ===== */
.archive-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 400;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s, visibility 0.25s;
}
.archive-overlay.active {
  opacity: 1;
  visibility: visible;
}

.archive-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 320px;
  max-width: 90vw;
  background: var(--archive-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-left: 1px solid rgba(255, 255, 255, 0.15);
  z-index: 401;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding-top: env(safe-area-inset-top, 0);
}
.archive-overlay.active .archive-panel {
  transform: translateX(0);
  animation: slideInRight 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.archive-header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(99, 102, 241, 0.1);
  min-height: 56px;
}
.archive-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.archive-close {
  background: rgba(99, 102, 241, 0.08);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: background 0.15s;
  min-width: 44px;
  min-height: 44px;
}
.archive-close:active {
  background: rgba(99, 102, 241, 0.15);
}
.archive-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.archive-card {
  background: var(--card-bg);
  border-radius: var(--card-border-radius);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.archive-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--card-hover-shadow);
}
.archive-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-hint);
  font-size: 14px;
}

/* ===== CONFETTI ===== */
.confetti-particle {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 9998;
  animation: confetti 1.2s ease forwards;
}

/* ===== LOADING ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    -45deg,
    var(--bg-gradient-1),
    var(--bg-gradient-2),
    var(--bg-gradient-3),
    var(--bg-gradient-4)
  );
  background-size: 400% 400%;
  animation: gradientShift 45s ease infinite;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s;
  gap: 20px;
}
.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-logo {
  width: 56px;
  height: 56px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.loading-logo-inner {
  display: flex;
  gap: 4px;
}
.loading-logo-bar {
  width: 8px;
  height: 18px;
  background: #ffffff;
  border-radius: 3px;
}
.loading-logo-bar:first-child { height: 24px; }
.loading-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-text {
  color: rgba(255, 255, 255, 0.75);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ===== MOBILE OPTIMIZATIONS ===== */
@media (max-width: 600px) {
  .header {
    padding: 0 8px;
    padding-top: env(safe-area-inset-top, 0);
  }

  .header-search {
    max-width: 160px;
  }

  .modal {
    max-height: 95vh;
    border-radius: 16px 16px 0 0;
  }

  .archive-panel {
    width: 100%;
    max-width: 100vw;
  }

  /* Touch-friendly tap targets */
  .header-btn,
  .dark-mode-toggle {
    width: 44px;
    height: 44px;
  }

  .add-card-btn {
    min-height: 48px;
    padding: 10px 12px;
  }

  .card-move-btn {
    min-width: 44px;
    min-height: 44px;
    width: 34px;
    height: 34px;
  }

  /* Safe area padding */
  .modal-actions {
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0));
  }

  .toast {
    bottom: calc(60px + env(safe-area-inset-bottom, 0));
    max-width: calc(100vw - 32px);
  }

  .filter-bar {
    padding: 6px 8px;
  }
}

/* ===== DESKTOP ENHANCEMENTS ===== */
@media (min-width: 601px) {
  .modal {
    border-radius: 16px;
    margin-bottom: 40px;
    max-height: 85vh;
  }

  .modal-overlay {

    if (tg && tg.HapticFeedback) {
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else if (type === 'select') tg.HapticFeedback.selectionChanged();
    }
  }

  function tasks() { return boardTasks[activeBoard]; }
  function archived() { return archivedTasks[activeBoard]; }

  // ===== RELATIVE TIME =====
  function relativeTime(ts) {
    var diff = Date.now() - ts;
    var sec = Math.floor(diff / 1000);
    var min = Math.floor(sec / 60);
    var hr = Math.floor(min / 60);
    var day = Math.floor(hr / 24);
    if (sec < 60) return 'только что';
    if (min < 60) return min + ' мин назад';
    if (hr < 24) return hr + ' час' + (hr === 1 ? '' : (hr < 5 ? 'а' : 'ов')) + ' назад';
    if (day === 1) return 'вчера';
    if (day < 7) return day + ' дн' + (day === 1 ? 'ь' : (day < 5 ? 'я' : 'ей')) + ' назад';
    return formatDate(ts);
  }

  // ===== DUE DATE HELPERS =====
  function dueDateLabel(ts) {
    if (!ts) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var dueDay = new Date(new Date(ts).getFullYear(), new Date(ts).getMonth(), new Date(ts).getDate()).getTime();
    var days = Math.round((dueDay - today) / 86400000);
    if (days < 0) return { text: 'просрочено', cls: 'due-overdue' };
    if (days === 0) return { text: 'сегодня', cls: 'due-today' };
    if (days === 1) return { text: 'завтра', cls: 'due-soon' };
    return { text: 'через ' + days + ' дн' + (days === 1 ? 'ь' : (days < 5 ? 'я' : 'ей')), cls: 'due-normal' };
  }

  function formatDateInput(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ===== NORMALIZE TASK =====
  function normalizeTask(t) {
    if (t.status && !t.column) {
      var statusMap = { 'backlog': 'backlog', 'in_progress': 'inprogress', 'inprogress': 'inprogress', 'rules': 'inprogress', 'progress': 'inprogress', 'review': 'review', 'done': 'done' };
      t.column = statusMap[t.status] || 'backlog';
    }
    if (!t.column) t.column = 'backlog';
    if (t.column === 'rules' || t.column === 'progress' || t.column === 'in_progress') t.column = 'inprogress';
    if (!t.labels) t.labels = [];
    if (!t.priority) t.priority = 'medium';
    if (!t.created && t.createdAt) t.created = new Date(t.createdAt).getTime();
    if (!t.created) t.created = Date.now();
    if (t.description && !t.desc) t.desc = t.description;
    if (!t.subtasks) t.subtasks = [];
    if (!t.dueDate) t.dueDate = null;
    return t;
  }

  function ensureLabels(t) {
    if (!t.labels || t.labels.length === 0) {
      if (t.priority === 'high') t.labels = ['red'];
      else if (t.priority === 'low') t.labels = ['green'];
      else t.labels = ['blue'];
    }
    return t;
  }

  // ===== DATA LOADING =====
  function fetchBoard(boardId, cb) {
    var cfg = BOARDS[boardId];
    var url = cfg.file + '?bust=' + Date.now() + Math.random();
    $('syncDot').classList.add('syncing');
    fetch(url)
      .then(function(r) { return r.ok ? r.text() : Promise.reject('no json'); })
      .then(function(text) {
        $('syncDot').classList.remove('syncing');
        boardDataHash[boardId] = text;
        try {
          boardTasks[boardId] = JSON.parse(text).map(normalizeTask);
          localStorage.setItem(cfg.storageKey, text);
          if (tg && tg.CloudStorage) tg.CloudStorage.setItem(cfg.storageKey, text, function() {});
          $('syncDot').title = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        } catch(e) { boardTasks[boardId] = []; }
        if (cb) cb(true);
      })
      .catch(function() {
        $('syncDot').classList.remove('syncing');
        try {
          var local = localStorage.getItem(cfg.storageKey);
          if (local) boardTasks[boardId] = JSON.parse(local).map(normalizeTask);
        } catch(e) {}
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(cfg.storageKey, function(err, val) {
            if (!err && val) try { boardTasks[boardId] = JSON.parse(val).map(normalizeTask); } catch(e) {}
            if (cb) cb(false);
          });
        } else { if (cb) cb(false); }
      });
  }

  function saveTasks() {
    var cfg = BOARDS[activeBoard];
    var data = JSON.stringify(boardTasks[activeBoard]);
    try { localStorage.setItem(cfg.storageKey, data); localStorage.setItem(cfg.storageKey + '_ts', String(Date.now())); } catch(e) {}
    if (tg && tg.CloudStorage) tg.CloudStorage.setItem(cfg.storageKey, data, function() {});
    boardDataHash[activeBoard] = data;
    try { localStorage.setItem(cfg.storageKey + '_archive', JSON.stringify(archivedTasks[activeBoard])); } catch(e) {}
  }

  function loadArchive() {

  // ===== CONFETTI =====
  function launchConfetti() {
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = ['#22c55e', '#eab308', '#f97316', '#ef4444', '#a855f7', '#6366f1', '#ec4899', '#06b6d4'];
    for (var i = 0; i < 70; i++) {
      particles.push({
        x: canvas.width * 0.5 + (Math.random() - 0.5) * 200, y: canvas.height * 0.4,
        vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4,
        size: Math.random() * 6 + 3, color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10, alpha: 1,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
    var startTime = Date.now();
    function animate() {
      var elapsed = Date.now() - startTime;
      if (elapsed > 3000) { canvas.remove(); return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p) {
        p.x += p.vx; p.vy += 0.25; p.y += p.vy; p.rotation += p.rotSpeed;
        if (elapsed > 2000) p.alpha = Math.max(0, 1 - (elapsed - 2000) / 1000);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
        ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
        if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      });
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  // ===== PROGRESS BAR =====
  function updateProgressBar() {
    var total = tasks().length;

  // ===== ANIMATED COUNTER =====
  function animateCounter(el, target) {
    var current = parseInt(el.textContent) || 0;
    if (current === target) return;
    var step = target > current ? 1 : -1;
    var delay = Math.max(30, 300 / Math.abs(target - current));
    function tick() { current += step; el.textContent = current; if (current !== target) setTimeout(tick, delay); }
    tick();
  }
  function updateHeaderCounter() {
    var total = tasks().length;
    var done = tasks().filter(function(t) { return t.column === 'done'; }).length;
    var counter = $('headerCounter');
    if (!counter) return;
    var doneSp = counter.querySelector('.counter-done');
    var totalSp = counter.querySelector('.counter-total');
    if (doneSp && totalSp) { animateCounter(doneSp, done); animateCounter(totalSp, total); }
  }

  // ===== FILTER SYSTEM =====
  function matchesFilters(task) {
    if (activeFilters.priorities.length > 0 && activeFilters.priorities.indexOf(task.priority) < 0) return false;
    if (activeFilters.labels.length > 0) {
      var tLabels = task.labels || [];
      if (!activeFilters.labels.some(function(l) { return tLabels.indexOf(l) >= 0; })) return false;
    }
    return true;
  }
  function toggleFilter(type, value) {
    var arr = activeFilters[type]; var idx = arr.indexOf(value);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(value);
    renderBoard(); haptic('select');
  }
  function clearFilters() { activeFilters.priorities = []; activeFilters.labels = []; renderBoard(); haptic('light'); }
  function hasActiveFilters() { return activeFilters.priorities.length > 0 || activeFilters.labels.length > 0; }

  // ===== ARCHIVE =====
  function archiveAllDone() {
    var doneItems = tasks().filter(function(t) { return t.column === 'done'; });
    if (doneItems.length === 0) { showToast('Нет завершённых задач'); return; }
    doneItems.forEach(function(t) { t.archivedAt = Date.now(); archivedTasks[activeBoard].push(t); });

    var task = archived().splice(idx, 1)[0]; delete task.archivedAt; task.column = 'backlog';

    var prevBtn = colIndex > 0 ? '<button class="card-move-btn" onclick="event.stopPropagation();K.move(\'' + t.id + '\',-1)" title="Назад">◂</button>' : '';
    var nextBtn = colIndex < COLUMNS.length - 1 ? '<button class="card-move-btn" onclick="event.stopPropagation();K.move(\'' + t.id + '\',1)" title="Вперёд">▸</button>' : '';
    var descIcon = t.desc ? '<div class="card-badge"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4V5zm0 4h16v2H4V9zm0 4h10v2H4v-2z"/></svg></div>' : '';
    var dueBadge = '';
    if (t.dueDate) { var due = dueDateLabel(t.dueDate); if (due) dueBadge = '<div class="card-badge ' + due.cls + '"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg> ' + due.text + '</div>'; }
    var subtaskBadge = '';
    if (t.subtasks && t.subtasks.length > 0) {
      var subDone = t.subtasks.filter(function(s) { return s.done; }).length;
      var subPct = Math.round(subDone / t.subtasks.length * 100);
      var subClass = subDone === t.subtasks.length ? 'subtask-complete' : '';
      subtaskBadge = '<div class="card-badge card-subtask-badge ' + subClass + '"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> ' + subDone + '/' + t.subtasks.length + '<div class="card-subtask-bar"><div class="card-subtask-fill" style="width:' + subPct + '%"></div></div></div>';
    }
    return '<div class="card" draggable="true" data-id="' + t.id + '" onclick="K.edit(\'' + t.id + '\')">' + labelsHTML +
      '<div class="card-title">' + escHtml(t.title) + '</div><div class="card-badges">' +
      '<div class="card-badge"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg> ' + relativeTime(t.created || Date.now()) + '</div>' +
      descIcon + dueBadge + subtaskBadge +
      '<div class="card-move-btns">' + prevBtn + nextBtn + '</div></div></div>' +
      '<div class="drop-zone" data-col="' + COLUMNS[colIndex].id + '" data-after="' + t.id + '"></div>';
  }

  // ===== DRAG & DROP =====
  function setupDragDrop() {
    document.querySelectorAll('.card[draggable]').forEach(function(card) {
      var longPressTimer = null, startX, startY, isDragging = false, clone = null;
      card.addEventListener('dragstart', function(e) {
        card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', card.dataset.id); haptic('medium');
      });
      card.addEventListener('dragend', function() { card.classList.remove('dragging'); document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.remove('active'); }); });
      card.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        longPressTimer = setTimeout(function() {
          isDragging = true; card.classList.add('dragging'); haptic('heavy');
          clone = card.cloneNode(true);
          clone.style.cssText = 'position:fixed;z-index:9000;pointer-events:none;width:' + card.offsetWidth + 'px;opacity:.85;transform:rotate(3deg);box-shadow:0 12px 40px rgba(0,0,50,.35);transition:none;';
          clone.style.left = (startX - card.offsetWidth / 2) + 'px'; clone.style.top = (startY - 30) + 'px';
          document.body.appendChild(clone);
          document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.add('active'); });
        }, 300);
      }, { passive: true });
      card.addEventListener('touchmove', function(e) {
        if (!isDragging) { if (Math.abs(e.touches[0].clientX - startX) > 8 || Math.abs(e.touches[0].clientY - startY) > 8) clearTimeout(longPressTimer); return; }
        e.preventDefault(); var touch = e.touches[0];
        if (clone) { clone.style.left = (touch.clientX - clone.offsetWidth / 2) + 'px'; clone.style.top = (touch.clientY - 30) + 'px'; }
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.remove('active'); dz.style.borderColor = ''; });
        if (el && (el.classList.contains('drop-zone') || el.classList.contains('column-body'))) el.classList.add('active');
      }, { passive: false });
      card.addEventListener('touchend', function(e) {
        clearTimeout(longPressTimer); if (clone) { clone.remove(); clone = null; } if (!isDragging) return;
        var touch = e.changedTouches[0]; var el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el) { var colBody = el.closest('.column-body'); if (colBody) {
          var targetCol = colBody.dataset.col; var task = tasks().find(function(t) { return t.id === card.dataset.id; });
          if (task && task.column !== targetCol) { var oldCol = task.column; task.column = targetCol; saveTasks(); haptic('success');
            showToast('Перемещено в «' + COLUMNS.find(function(c) { return c.id === targetCol; }).name + '»');
            if (targetCol === 'done' && oldCol !== 'done') launchConfetti(); }
        }}
        card.classList.remove('dragging'); document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.remove('active'); }); isDragging = false; renderBoard();
      }, { passive: true });
    });
    document.querySelectorAll('.drop-zone, .column-body').forEach(function(zone) {
      zone.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; zone.classList.add('active'); });
      zone.addEventListener('dragleave', function() { zone.classList.remove('active'); });
      zone.addEventListener('drop', function(e) {
        e.preventDefault(); zone.classList.remove('active');
        var taskId = e.dataTransfer.getData('text/plain');
        var targetCol = zone.dataset.col || (zone.closest('.column-body') || {}).dataset.col;
        if (taskId && targetCol) { var task = tasks().find(function(t) { return t.id === taskId; });
          if (task && task.column !== targetCol) { var oldCol = task.column; task.column = targetCol; saveTasks(); renderBoard(); haptic('success');
            showToast('Перемещено в «' + COLUMNS.find(function(c) { return c.id === targetCol; }).name + '»');
            if (targetCol === 'done' && oldCol !== 'done') launchConfetti(); }
        }
      });
    });
  }

  // ===== GLOBAL API =====
  window.K = {
    move: function(taskId, dir) {
      var task = tasks().find(function(t) { return t.id === taskId; }); if (!task) return;
      var ci = COLUMNS.findIndex(function(c) { return c.id === task.column; }); var ni = ci + dir;
      if (ni < 0 || ni >= COLUMNS.length) return;
      var oldCol = task.column; task.column = COLUMNS[ni].id; saveTasks(); renderBoard(); haptic('select');
      showToast('→ ' + COLUMNS[ni].name);
      if (COLUMNS[ni].id === 'done' && oldCol !== 'done') launchConfetti();
    },
    edit: function(taskId) {
      var task = tasks().find(function(t) { return t.id === taskId; }); if (!task) return;
      editingId = taskId;
      $('modalTitle').textContent = escHtml(task.title);
      $('modalSubtitle').textContent = 'в списке «' + (COLUMNS.find(function(c) { return c.id === task.column; }) || {}).name + '»';
      $('taskTitle').value = task.title; $('taskDesc').value = task.desc || '';
      document.querySelectorAll('#labelsPicker .label-chip').forEach(function(chip) { chip.classList.toggle('selected', (task.labels || []).indexOf(chip.dataset.label) >= 0); });
      document.querySelectorAll('#priorityPicker button').forEach(function(b) { b.classList.toggle('selected', b.dataset.p === task.priority); });
      document.querySelectorAll('#columnPicker button').forEach(function(b) { b.classList.toggle('selected', b.dataset.c === task.column); });
      var dueDateInput = $('taskDueDate'); if (dueDateInput) dueDateInput.value = task.dueDate ? formatDateInput(task.dueDate) : '';
      var subtasksSection = $('subtasksSection'); if (subtasksSection) { subtasksSection.style.display = 'block'; renderSubtasksInModal(task); }
      $('modalDelete').style.display = 'block'; $('columnPickerGroup').style.display = 'block'; openModal(); haptic('light');
    },
    addToCol: function(colId) { editingId = null; resetForm(); document.querySelectorAll('#columnPicker button').forEach(function(b) { b.classList.toggle('selected', b.dataset.c === colId); }); openModal(); haptic('light'); },
    confirmDel: function(taskId) { deleteTargetId = taskId; var task = tasks().find(function(t) { return t.id === taskId; }); $('confirmText').textContent = task ? '«' + task.title + '» — это нельзя отменить.' : 'Это нельзя отменить.'; $('confirmOverlay').classList.add('active'); haptic('medium'); },
    toggleFilter: toggleFilter, clearFilters: clearFilters,
    toggleStats: function() { statsVisible = !statsVisible; renderStats(); haptic('select'); },
    toggleArchive: toggleArchive, archiveAllDone: archiveAllDone, restoreFromArchive: restoreFromArchive,
    addSubtask: addSubtask, toggleSubtask: toggleSubtask, deleteSubtask: deleteSubtask,
    toggleShortcuts: function() { shortcutsVisible = !shortcutsVisible; renderShortcutsHelp(); }
  };

  // ===== MODAL =====
  function openModal() { $('taskModal').classList.add('active'); setTimeout(function() { $('taskTitle').focus(); }, 300); }
  function closeModal() { $('taskModal').classList.remove('active'); editingId = null; resetForm(); }
  function resetForm() {
    $('taskTitle').value = ''; $('taskDesc').value = '';
    $('modalTitle').textContent = 'Новая задача'; $('modalSubtitle').textContent = 'Добавить в доску';
    document.querySelectorAll('#labelsPicker .label-chip').forEach(function(c) { c.classList.remove('selected'); });
    document.querySelectorAll('#priorityPicker button').forEach(function(b) { b.classList.remove('selected'); });
    var medBtn = document.querySelector('#priorityPicker button[data-p="medium"]'); if (medBtn) medBtn.classList.add('selected');
    document.querySelectorAll('#columnPicker button').forEach(function(b) { b.classList.remove('selected'); });
    var blBtn = document.querySelector('#columnPicker button[data-c="backlog"]'); if (blBtn) blBtn.classList.add('selected');
    $('modalDelete').style.display = 'none';
    var dueDateInput = $('taskDueDate'); if (dueDateInput) dueDateInput.value = '';
    var subtasksSection = $('subtasksSection'); if (subtasksSection) { subtasksSection.style.display = 'none'; var c = $('subtasksContainer'); if (c) c.innerHTML = ''; }
  }
  function getSelectedLabels() { var labels = []; document.querySelectorAll('#labelsPicker .label-chip.selected').forEach(function(c) { labels.push(c.dataset.label); }); return labels; }

  // ===== EVENTS =====
  $('tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.board-tab'); if (!tab || tab.classList.contains('active')) return;
    document.querySelectorAll('.board-tab').forEach(function(t) { t.classList.remove('active'); }); tab.classList.add('active');
    activeBoard = tab.dataset.board; $('boardName').textContent = BOARD_NAMES[activeBoard] || 'Задачи';
    searchQuery = ''; $('searchInput').value = ''; $('searchClear').classList.remove('visible');
    loadArchive(); renderBoard(); $('board').scrollLeft = 0; haptic('select');
  });
  $('modalCancel').onclick = closeModal; $('modalClose').onclick = closeModal;
  $('taskModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  $('labelsPicker').addEventListener('click', function(e) { var chip = e.target.closest('.label-chip'); if (!chip) return; chip.classList.toggle('selected'); haptic('select'); });
  $('priorityPicker').addEventListener('click', function(e) { var btn = e.target.closest('button'); if (!btn) return; this.querySelectorAll('button').forEach(function(b) { b.classList.remove('selected'); }); btn.classList.add('selected'); haptic('select'); });
  $('columnPicker').addEventListener('click', function(e) { var btn = e.target.closest('button'); if (!btn) return; this.querySelectorAll('button').forEach(function(b) { b.classList.remove('selected'); }); btn.classList.add('selected'); haptic('select'); });

  $('modalSave').onclick = function() {
    var title = $('taskTitle').value.trim();
    if (!title) { haptic('error'); $('taskTitle').style.borderColor = 'var(--danger)'; setTimeout(function() { $('taskTitle').style.borderColor = ''; }, 1200); return; }
    var desc = $('taskDesc').value.trim();
    var priority = (document.querySelector('#priorityPicker .selected') || {}).dataset.p || 'medium';
    var column = (document.querySelector('#columnPicker .selected') || {}).dataset.c || 'backlog';
    var labels = getSelectedLabels();
    var dueDateInput = $('taskDueDate');
    var dueDate = dueDateInput && dueDateInput.value ? new Date(dueDateInput.value).getTime() : null;
    if (editingId) {
      var task = tasks().find(function(t) { return t.id === editingId; });
      if (task) { var oldCol = task.column; task.title = title; task.desc = desc; task.priority = priority; task.column = column; task.labels = labels; task.dueDate = dueDate; showToast('Обновлено'); if (column === 'done' && oldCol !== 'done') launchConfetti(); }
    } else {
      tasks().unshift({ id: genId(), title: title, desc: desc, priority: priority, column: column, labels: labels, created: Date.now(), subtasks: [], dueDate: dueDate });
      showToast('Карточка добавлена');
    }
    saveTasks(); closeModal(); renderBoard(); haptic('success');
  };
  $('modalDelete').onclick = function() { if (editingId) { closeModal(); K.confirmDel(editingId); } };
  $('confirmYes').onclick = function() { if (deleteTargetId) { boardTasks[activeBoard] = tasks().filter(function(t) { return t.id !== deleteTargetId; }); saveTasks(); renderBoard(); haptic('success'); showToast('Удалено'); deleteTargetId = null; } $('confirmOverlay').classList.remove('active'); };
  $('confirmNo').onclick = function() { $('confirmOverlay').classList.remove('active'); deleteTargetId = null; };
  $('confirmOverlay').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('active'); deleteTargetId = null; } });

  var searchDebounce = null;
  $('searchInput').addEventListener('input', function() { clearTimeout(searchDebounce); var val = this.value; $('searchClear').classList.toggle('visible', val.length > 0); searchDebounce = setTimeout(function() { searchQuery = val; renderBoard(); }, 150); });
  $('searchClear').onclick = function() { $('searchInput').value = ''; searchQuery = ''; this.classList.remove('visible'); renderBoard(); $('searchInput').focus(); haptic('light'); };
  $('refreshBtn').onclick = function() { haptic('light'); var cfg = BOARDS[activeBoard]; localStorage.removeItem(cfg.storageKey); localStorage.removeItem(cfg.storageKey + '_ts'); if (tg && tg.CloudStorage) tg.CloudStorage.removeItem(cfg.storageKey, function() {}); boardDataHash[activeBoard] = null; fetchBoard(activeBoard, function() { renderBoard(); showToast('🔄 Обновлено'); }); };
  $('filterBtn').onclick = function() { var bar = $('filterBar'); bar.classList.toggle('force-show'); if (bar.classList.contains('force-show')) bar.style.display = 'block'; else if (!hasActiveFilters()) bar.style.display = 'none'; renderFilterBar(); haptic('light'); };
  $('statsBtn').onclick = function() { K.toggleStats(); };
  $('archiveBtn').onclick = function() { K.toggleArchive(); };
  $('darkModeBtn').onclick = toggleDarkMode;
  $('board').addEventListener('scroll', updateDots);

  // ===== KEYBOARD SHORTCUTS =====
  document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var isInput = tag === 'input' || tag === 'textarea';
    var modalOpen = $('taskModal').classList.contains('active');
    if (e.key === 'Escape') {
      if (shortcutsVisible) { shortcutsVisible = false; renderShortcutsHelp(); return; }
      if (archiveVisible) { archiveVisible = false; renderArchivePanel(); return; }
      closeModal(); $('confirmOverlay').classList.remove('active'); return;
    }
    if (isInput || modalOpen) { if (e.key === 'Enter' && e.target === $('taskTitle')) { e.preventDefault(); $('modalSave').click(); } return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); K.addToCol('backlog'); }
    else if (e.key === 'f' || e.key === 'F' || e.key === '/') { e.preventDefault(); $('searchInput').focus(); }
    else if (e.key >= '1' && e.key <= '4') { e.preventDefault(); var ci = parseInt(e.key) - 1; if (ci < COLUMNS.length) { var el = document.getElementById('col-' + COLUMNS[ci].id); if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center' }); } }
    else if (e.key === 'd' || e.key === 'D') toggleDarkMode();
    else if (e.key === 's' || e.key === 'S') K.toggleStats();
    else if (e.key === 'a' || e.key === 'A') K.toggleArchive();
    else if (e.key === '?') { e.preventDefault(); K.toggleShortcuts(); }
  });

  // ===== INIT =====
  initDarkMode();
  loadAllBoards(function() {
    isLoading = false;
    $('loadingOverlay').classList.add('hidden');
    setTimeout(function() { $('loadingOverlay').style.display = 'none'; }, 300);
    loadArchive(); renderBoard(); updateDots(); startAutoRefresh();
  });
})();
</script>
