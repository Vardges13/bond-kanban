<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бонд — Задачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --trello-blue: #0079BF;
    --trello-blue-dark: #026AA7;
    --trello-header: #026AA7;
    --trello-board-bg: linear-gradient(135deg, #0079BF 0%, #026AA7 100%);
    --column-bg: #EBECF0;
    --column-header-color: #172B4D;
    --card-bg: #FFFFFF;
    --card-shadow: 0 1px 0 rgba(9,30,66,.25);
    --card-hover-shadow: 0 2px 4px rgba(9,30,66,.25);
    --card-border-radius: 3px;
    --column-border-radius: 3px;
    --text-primary: #172B4D;
    --text-secondary: #5E6C84;
    --text-hint: #6B778C;
    --btn-add-color: #5E6C84;
    --btn-add-hover: #091E42;
    --overlay-bg: rgba(0,0,0,.64);
    --modal-bg: #F4F5F7;
    --label-green: #61BD4F;
    --label-yellow: #F2D600;
    --label-orange: #FF9F1A;
    --label-red: #EB5A46;
    --label-purple: #C377E0;
    --label-blue: #0079BF;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    background: var(--trello-blue);
    background: var(--trello-board-bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  /* ===== HEADER — Trello top bar ===== */
  .header {
    background: rgba(0,0,0,.15);
    backdrop-filter: saturate(150%) blur(10px);
    -webkit-backdrop-filter: saturate(150%) blur(10px);
    padding: 0 8px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    z-index: 100;
  }

  .header-board-name {
    font-size: 18px;
    font-weight: 700;
    color: #FFFFFF;
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
    min-width: 80px;
  }

  /* ===== HEADER SEARCH — Trello style ===== */
  .header-search {
    flex: 1;
    max-width: 220px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .header-search-icon {
    position: absolute;
    left: 8px;
    font-size: 14px;
    color: #6B778C;
    pointer-events: none;
    z-index: 1;
  }
  .header-search input {
    width: 100%;
    padding: 6px 28px 6px 30px;
    border-radius: 3px;
    border: none;
    background: rgba(255,255,255,.9);
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: background .15s, box-shadow .15s;
  }
  .header-search input::placeholder {
    color: #6B778C;
  }
  .header-search input:focus {
    background: #FFFFFF;
    box-shadow: 0 0 0 2px var(--trello-blue);
  }
  .header-search-clear {
    position: absolute;
    right: 4px;
    background: none;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    color: #6B778C;
    transition: background .1s, color .1s;
  }
  .header-search-clear:hover {
    background: rgba(9,30,66,.08);
    color: var(--text-primary);
  }
  .header-search-clear.visible {
    display: flex;
  }

  .header-btn {
    background: rgba(255,255,255,.2);
    border: none;
    color: #FFFFFF;
    width: 32px;
    height: 32px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s;
  }
  .header-btn:active { background: rgba(255,255,255,.35); }

  .sync-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #61BD4F;
    transition: background .3s;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .sync-indicator.syncing {
    background: #F2D600;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ===== BOARD TABS — below header ===== */
  .board-tabs {
    background: rgba(0,0,0,.1);
    display: flex;
    height: 40px;
    flex-shrink: 0;
    padding: 0 4px;
    gap: 2px;
    align-items: stretch;
  }
  .board-tab {
    flex: 1;
    background: none;
    border: none;
    color: rgba(255,255,255,.7);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 3px 3px 0 0;
    transition: background .15s, color .15s;
    position: relative;
    padding: 0 12px;
  }
  .board-tab.active {
    background: rgba(255,255,255,.15);
    color: #FFFFFF;
  }
  .board-tab::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 8px;
    right: 8px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: #FFFFFF;
    transform: scaleX(0);
    transition: transform .2s;
  }
  .board-tab.active::after { transform: scaleX(1); }
  .board-tab:active { background: rgba(255,255,255,.2); }

  .tab-badge {
    background: rgba(255,255,255,.25);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    text-align: center;
  }
  .board-tab.active .tab-badge {
    background: rgba(255,255,255,.35);
  }

  /* ===== BOARD — horizontal scroll ===== */
  .board {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 8px 4px 8px 8px;
    gap: 8px;
    align-items: flex-start;
    scroll-snap-type: x proximity;
  }
  .board::-webkit-scrollbar { height: 8px; }
  .board::-webkit-scrollbar-track { background: transparent; }
  .board::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 4px; }

  /* ===== COLUMN — Trello list ===== */
  .column {
    flex: 0 0 272px;
    max-width: 272px;
    min-width: 272px;
    background: var(--column-bg);
    border-radius: var(--column-border-radius);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 110px);
    scroll-snap-align: start;
  }

  @media (max-width: 600px) {
    .column {
      flex: 0 0 calc(100vw - 20px);
      max-width: calc(100vw - 20px);
      min-width: calc(100vw - 20px);
      scroll-snap-align: center;
    }
    .board {
      scroll-snap-type: x mandatory;
      padding: 8px 6px 8px 10px;
    }
  }

  .column-header {
    padding: 8px 8px 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 36px;
    cursor: default;
  }
  .column-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--column-header-color);
    flex: 1;
    padding: 2px 4px;
    line-height: 1.4;
  }
  .column-count {
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(9,30,66,.08);
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 500;
  }

  .column-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 4px 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(9,30,66,.13) transparent;
  }
  .column-body::-webkit-scrollbar { width: 6px; }
  .column-body::-webkit-scrollbar-track { background: transparent; }
  .column-body::-webkit-scrollbar-thumb { background: rgba(9,30,66,.13); border-radius: 3px; }

  /* ===== ADD CARD BUTTON — bottom of list ===== */
  .add-card-btn {
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    border-radius: 0 0 var(--column-border-radius) var(--column-border-radius);
    color: var(--btn-add-color);
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: background .1s, color .1s;
  }
  .add-card-btn:hover,
  .add-card-btn:active {
    background: rgba(9,30,66,.08);
    color: var(--btn-add-hover);
  }
  .add-card-btn .plus {
    font-size: 18px;
    line-height: 1;
    font-weight: 300;
  }

  /* ===== CARD — Trello card ===== */
  .card {
    background: var(--card-bg);
    border-radius: var(--card-border-radius);
    box-shadow: var(--card-shadow);
    padding: 6px 8px 4px;
    margin-bottom: 6px;
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, box-shadow .12s ease, background .1s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
  }
  .card:hover {
    background: #F4F5F7;
  }
  .card:active {
    transform: none;
  }
  .card.dragging {
    opacity: .5;
    transform: rotate(3deg) scale(1.02);
    box-shadow: 0 8px 25px rgba(9,30,66,.35);
    z-index: 1000;
  }

  /* Card labels — colored strips at top */
  .card-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 4px;
  }
  .card-label {
    width: 40px;
    height: 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .card-label.green { background: var(--label-green); }
  .card-label.yellow { background: var(--label-yellow); }
  .card-label.orange { background: var(--label-orange); }
  .card-label.red { background: var(--label-red); }
  .card-label.purple { background: var(--label-purple); }
  .card-label.blue { background: var(--label-blue); }

  .card-title {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.4;
    word-wrap: break-word;
  }

  .card-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .card-badge {
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .card-badge svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .card-move-btns {
    display: flex;
    gap: 2px;
    margin-left: auto;
  }
  .card-move-btn {
    background: rgba(9,30,66,.04);
    border: none;
    border-radius: 3px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: background .1s;
  }
  .card-move-btn:active {
    background: rgba(9,30,66,.13);
  }

  /* ===== DROP ZONE ===== */
  .drop-zone {
    min-height: 2px;
    border: 2px dashed transparent;
    border-radius: var(--card-border-radius);
    transition: all .15s;
    margin-bottom: 2px;
  }
  .drop-zone.active {
    border-color: var(--trello-blue);
    background: rgba(0,121,191,.08);
    min-height: 40px;
    border-radius: var(--card-border-radius);
  }

  /* ===== COLUMN DOTS (mobile) ===== */
  .column-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 4px 0;
    flex-shrink: 0;
  }
  @media (min-width: 601px) { .column-dots { display: none; } }
  .cdot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transition: all .2s;
  }
  .cdot.active {
    background: #FFFFFF;
    transform: scale(1.5);
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 16px 8px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 24px; margin-bottom: 4px; opacity: .5; }
  .empty-state p { font-size: 12px; line-height: 1.4; }

  /* ===== MODAL — Trello card detail ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    z-index: 500;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }

  .modal {
    background: var(--modal-bg);
    border-radius: 8px 8px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
  }
  .modal-overlay.active .modal { transform: translateY(0); }

  .modal-header {
    padding: 12px 12px 8px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    border-bottom: 1px solid rgba(9,30,66,.13);
    background: #FFFFFF;
    border-radius: 8px 8px 0 0;
  }
  .modal-header-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    flex-shrink: 0;
    font-size: 16px;
    margin-top: 2px;
  }
  .modal-header-content { flex: 1; }
  .modal-title-text {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .modal-close-btn {
    background: none;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: background .1s;
    flex-shrink: 0;
  }
  .modal-close-btn:active { background: rgba(9,30,66,.08); }

  .modal-body { padding: 0; }

  .form-section {
    padding: 12px 16px;
    background: #FFFFFF;
    margin-bottom: 2px;
  }
  .form-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .form-section input,
  .form-section textarea {
    width: 100%;
    padding: 8px 12px;
    border: 2px solid #DFE1E6;
    border-radius: 3px;
    background: #FAFBFC;
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .form-section input:focus,
  .form-section textarea:focus {
    border-color: var(--trello-blue);
    background: #FFFFFF;
  }
  .form-section textarea {
    min-height: 60px;
    resize: vertical;
  }
  .form-section input::placeholder,
  .form-section textarea::placeholder {
    color: #A5ADBA;
  }

  /* Labels picker */
  .labels-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .label-chip {
    width: 40px;
    height: 24px;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .1s, transform .1s;
    position: relative;
  }
  .label-chip:active { transform: scale(.92); }
  .label-chip.selected {
    border-color: var(--text-primary);
  }
  .label-chip.selected::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .label-chip.green { background: var(--label-green); }
  .label-chip.yellow { background: var(--label-yellow); }
  .label-chip.orange { background: var(--label-orange); }
  .label-chip.red { background: var(--label-red); }
  .label-chip.purple { background: var(--label-purple); }
  .label-chip.blue { background: var(--label-blue); }

  /* Priority picker */
  .priority-picker {
    display: flex;
    gap: 6px;
  }
  .priority-btn {
    flex: 1;
    padding: 8px 4px;
    border: 2px solid #DFE1E6;
    border-radius: 3px;
    background: #FAFBFC;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .1s, background .1s;
    text-align: center;
  }
  .priority-btn:active { background: #EBECF0; }
  .priority-btn.selected {
    border-color: var(--trello-blue);
    background: rgba(0,121,191,.08);
    color: var(--trello-blue);
    font-weight: 600;
  }

  /* Column picker */
  .column-picker {
    display: flex;
    gap: 4px;
  }
  .col-pick-btn {
    flex: 1;
    padding: 8px 2px;
    border: 2px solid #DFE1E6;
    border-radius: 3px;
    background: #FAFBFC;
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .1s, background .1s;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .col-pick-btn:active { background: #EBECF0; }
  .col-pick-btn.selected {
    border-color: var(--trello-blue);
    background: rgba(0,121,191,.08);
    color: var(--trello-blue);
    font-weight: 600;
  }

  /* Modal actions */
  .modal-actions {
    display: flex;
    gap: 8px;
    padding: 12px 16px 8px;
    background: var(--modal-bg);
  }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 3px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity .12s;
  }
  .modal-actions button:active { opacity: .7; }
  .btn-primary {
    background: var(--trello-blue);
    color: #FFFFFF;
  }
  .btn-secondary {
    background: rgba(9,30,66,.04);
    color: var(--text-primary);
    border: 1px solid #DFE1E6 !important;
  }
  .btn-danger {
    background: var(--label-red);
    color: #FFFFFF;
  }

  /* ===== CONFIRM DIALOG ===== */
  .confirm-overlay {
    position: fixed; inset: 0;
    background: var(--overlay-bg);
    z-index: 600;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .2s, visibility .2s;
    padding: 20px;
  }
  .confirm-overlay.active { opacity: 1; visibility: visible; }
  .confirm-box {
    background: #FFFFFF;
    border-radius: 3px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 16px -4px rgba(9,30,66,.25), 0 0 0 1px rgba(9,30,66,.08);
    transform: scale(.92);
    transition: transform .2s;
  }
  .confirm-overlay.active .confirm-box { transform: scale(1); }
  .confirm-box h3 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .confirm-box p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .confirm-box .btns { display: flex; gap: 8px; }
  .confirm-box .btns button {
    flex: 1;
    padding: 10px;
    border-radius: 3px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: #172B4D;
    color: #FFFFFF;
    padding: 8px 20px;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: transform .2s, opacity .2s;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(9,30,66,.25);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== LOADING ===== */
  .loading-overlay {
    position: fixed; inset: 0;
    background: var(--trello-blue);
    background: var(--trello-board-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .3s;
    gap: 16px;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .loading-logo-inner {
    display: flex;
    gap: 4px;
  }
  .loading-logo-bar {
    width: 8px;
    height: 18px;
    background: #FFFFFF;
    border-radius: 2px;
  }
  .loading-logo-bar:first-child { height: 22px; }
  .loading-spinner {
    width: 24px; height: 24px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    color: rgba(255,255,255,.8);
    font-size: 13px;
    font-weight: 500;
  }
</style>
</head>
<body>

  <!-- Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-logo">
      <div class="loading-logo-inner">
        <div class="loading-logo-bar"></div>
        <div class="loading-logo-bar"></div>
      </div>
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Загрузка...</div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="sync-indicator" id="syncDot" title="Синхронизация"></div>
    <div class="header-board-name" id="boardName">Бонд — Задачи</div>
    <div class="header-search">
      <span class="header-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
      <button class="header-search-clear" id="searchClear" type="button">✕</button>
    </div>
    <button class="header-btn" id="refreshBtn" title="Принудительное обновление (очистить кэш)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 6h6V0l-2.35 2.35z"/></svg>
    </button>
  </div>

  <!-- Board Tabs -->
  <div class="board-tabs" id="tabs">
    <button class="board-tab active" data-board="bond">Бонд <span class="tab-badge" id="badgeBond">0</span></button>
    <button class="board-tab" data-board="vardges">Вардгес <span class="tab-badge" id="badgeVardges">0</span></button>
  </div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Column dots (mobile) -->
  <div class="column-dots" id="columnDots"></div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zm0 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2zm0 6a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2z"/></svg>
        </div>
        <div class="modal-header-content">
          <div class="modal-title-text" id="modalTitle">Новая задача</div>
          <div class="modal-subtitle" id="modalSubtitle">Добавить в доску</div>
        </div>
        <button class="modal-close-btn" id="modalClose" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-section-title">Название</div>
          <input type="text" id="taskTitle" placeholder="Введите название задачи..." autocomplete="off">
        </div>
        <div class="form-section">
          <div class="form-section-title">Описание</div>
          <textarea id="taskDesc" placeholder="Добавьте описание..."></textarea>
        </div>
        <div class="form-section">
          <div class="form-section-title">Метки</div>
          <div class="labels-picker" id="labelsPicker">
            <div class="label-chip green" data-label="green"></div>
            <div class="label-chip yellow" data-label="yellow"></div>
            <div class="label-chip orange" data-label="orange"></div>
            <div class="label-chip red" data-label="red"></div>
            <div class="label-chip purple" data-label="purple"></div>
            <div class="label-chip blue" data-label="blue"></div>
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-title">Приоритет</div>
          <div class="priority-picker" id="priorityPicker">
            <button class="priority-btn" data-p="high" type="button">Высокий</button>
            <button class="priority-btn selected" data-p="medium" type="button">Средний</button>
            <button class="priority-btn" data-p="low" type="button">Низкий</button>
          </div>
        </div>
        <div class="form-section" id="columnPickerGroup">
          <div class="form-section-title">Список</div>
          <div class="column-picker" id="columnPicker">
            <button class="col-pick-btn selected" data-c="backlog" type="button">📋 Бэклог</button>
            <button class="col-pick-btn" data-c="review" type="button">👀 На проверке</button>
            <button class="col-pick-btn" data-c="done" type="button">✅ Готово</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancel" type="button">Отмена</button>
        <button class="btn-danger" id="modalDelete" type="button" style="display:none">Удалить</button>
        <button class="btn-primary" id="modalSave" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3>Удалить задачу?</h3>
      <p id="confirmText">Это действие нельзя отменить.</p>
      <div class="btns">
        <button class="btn-secondary" id="confirmNo">Отмена</button>
        <button class="btn-danger" id="confirmYes">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ===== TELEGRAM INIT =====
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.enableClosingConfirmation();
    try { tg.disableVerticalSwipes(); } catch(e) {}
    // Set header color to Trello blue
    try { tg.setHeaderColor('#026AA7'); } catch(e) {}
    try { tg.setBackgroundColor('#0079BF'); } catch(e) {}
  }

  // ===== COLUMNS CONFIG =====
  var COLUMNS = [
    { id: 'backlog', name: '📋 Backlog', emptyIcon: '📥', emptyText: 'Нет новых задач' },
    { id: 'review', name: '👀 На проверке', emptyIcon: '🔍', emptyText: 'Нет задач на проверке' },
    { id: 'done', name: '✅ Готово', emptyIcon: '🎉', emptyText: 'Задач не завершено' }
  ];

  var BOARDS = {
    bond: { file: 'tasks.json', storageKey: 'kanban_bond_v8' },
    vardges: { file: 'tasks-vardges.json', storageKey: 'kanban_vardges_v1' }
  };

  var BOARD_NAMES = {
    bond: 'Бонд — Задачи',
    vardges: 'Вардгес — Задачи'
  };

  var LABEL_COLORS = ['green', 'yellow', 'orange', 'red', 'purple', 'blue'];

  // ===== STATE =====
  var activeBoard = 'bond';
  var boardTasks = { bond: [], vardges: [] };
  var boardDataHash = { bond: '', vardges: '' };
  var editingId = null;
  var searchQuery = '';
  var deleteTargetId = null;
  var refreshTimer = null;
  var isLoading = true;

  // ===== UTILS =====
  function $(id) { return document.getElementById(id); }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function formatDate(ts) {
    var d = new Date(ts);
    var months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    return d.getDate() + ' ' + months[d.getMonth()];
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function haptic(type) {
    if (tg && tg.HapticFeedback) {
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else if (type === 'select') tg.HapticFeedback.selectionChanged();
    }
  }

  function tasks() { return boardTasks[activeBoard]; }

  // Map old status field to column field for backward compat
  function normalizeTask(t) {
    if (t.status && !t.column) {
      var statusMap = { 'backlog': 'backlog', 'in_progress': 'rules', 'rules': 'rules', 'progress': 'rules', 'review': 'review', 'done': 'done' };
      t.column = statusMap[t.status] || 'backlog';
    }
    if (!t.column) t.column = 'backlog';
    if (!t.labels) t.labels = [];
    if (!t.priority) t.priority = 'medium';
    if (!t.created && t.createdAt) t.created = new Date(t.createdAt).getTime();
    if (!t.created) t.created = Date.now();
    if (t.description && !t.desc) t.desc = t.description;
    return t;
  }

  // Assign random labels to tasks without any (for visual richness)
  function ensureLabels(t) {
    if (!t.labels || t.labels.length === 0) {
      // Assign label based on priority
      if (t.priority === 'high') t.labels = ['red'];
      else if (t.priority === 'low') t.labels = ['green'];
      else t.labels = ['blue'];
    }
    return t;
  }

  // ===== DATA LOADING =====
  function fetchBoard(boardId, cb) {
    var cfg = BOARDS[boardId];
    var url = cfg.file + '?bust=' + Date.now() + Math.random();
    $('syncDot').classList.add('syncing');
    
    // Force clear old CloudStorage on v7 migration
    if (cfg.storageKey === 'kanban_bond_v7' && tg && tg.CloudStorage) {
      tg.CloudStorage.removeItem('kanban_bond_v6', function() {});
    }

    fetch(url)
      .then(function(r) { return r.ok ? r.text() : Promise.reject('no json'); })
      .then(function(text) {
        $('syncDot').classList.remove('syncing');
        boardDataHash[boardId] = text; // Always update hash
        try {
          var parsed = JSON.parse(text);
          boardTasks[boardId] = parsed.map(normalizeTask);
          // Force update CloudStorage with new data
          localStorage.setItem(cfg.storageKey, text);
          if (tg && tg.CloudStorage) {
            tg.CloudStorage.setItem(cfg.storageKey, text, function() {
              console.log('CloudStorage updated with fresh data');
            });
          }
          // Update last sync indicator
          var lastUpdate = new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
          $('syncDot').title = 'Обновлено: ' + lastUpdate;
        } catch(e) {
          boardTasks[boardId] = [];
        }
        if (cb) cb(true);
      })
      .catch(function() {
        $('syncDot').classList.remove('syncing');
        try {
          var local = localStorage.getItem(cfg.storageKey);
          if (local) {
            boardTasks[boardId] = JSON.parse(local).map(normalizeTask);
          }
        } catch(e) {}
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(cfg.storageKey, function(err, val) {
            if (!err && val) {
              try { boardTasks[boardId] = JSON.parse(val).map(normalizeTask); } catch(e) {}
            }
            if (cb) cb(false);
          });
        } else {
          if (cb) cb(false);
        }
      });
  }

  function saveTasks() {
    var cfg = BOARDS[activeBoard];
    var data = JSON.stringify(boardTasks[activeBoard]);
    try {
      localStorage.setItem(cfg.storageKey, data);
      localStorage.setItem(cfg.storageKey + '_ts', String(Date.now()));
    } catch(e) {}
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.setItem(cfg.storageKey, data, function() {});
    }
    boardDataHash[activeBoard] = data;
  }

  function loadAllBoards(cb) {
    var loaded = 0;
    var total = 2;
    function done() {
      loaded++;
      if (loaded >= total && cb) cb();
    }
    fetchBoard('bond', done);
    fetchBoard('vardges', done);
  }

  // ===== AUTO-REFRESH =====
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() {
      fetchBoard(activeBoard, function(changed) {
        if (changed) renderBoard();
      });
    }, 30000);
  }

  // ===== RENDER =====
  function getColumnTasks(colId) {
    var list = tasks().filter(function(t) { return t.column === colId; });
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      list = list.filter(function(t) {
        return t.title.toLowerCase().indexOf(q) >= 0 ||
               (t.desc && t.desc.toLowerCase().indexOf(q) >= 0);
      });
    }
    var pOrder = { high: 0, medium: 1, low: 2 };
    list.sort(function(a, b) {
      return (pOrder[a.priority] || 1) - (pOrder[b.priority] || 1);
    });
    return list;
  }

  function renderTabBadges() {
    var bondActive = boardTasks.bond.filter(function(t) { return t.column !== 'done'; }).length;
    var vardgesActive = boardTasks.vardges.filter(function(t) { return t.column !== 'done'; }).length;
    $('badgeBond').textContent = bondActive;
    $('badgeVardges').textContent = vardgesActive;
  }

  function renderDots() {
    var dots = $('columnDots');
    dots.innerHTML = COLUMNS.map(function(c, i) {
      return '<div class="cdot' + (i === 0 ? ' active' : '') + '" data-col="' + i + '"></div>';
    }).join('');
  }

  function updateDots() {
    var board = $('board');
    var cols = board.querySelectorAll('.column');
    if (!cols.length) return;
    var scrollL = board.scrollLeft;
    var colW = cols[0].offsetWidth + 8;
    var idx = Math.round(scrollL / colW);
    if (idx < 0) idx = 0;
    if (idx >= COLUMNS.length) idx = COLUMNS.length - 1;
    document.querySelectorAll('#columnDots .cdot').forEach(function(d, i) {
      d.classList.toggle('active', i === idx);
    });
  }

  function renderBoard() {
    var board = $('board');
    board.innerHTML = COLUMNS.map(function(col, ci) {
      var colTasks = getColumnTasks(col.id);
      var emptyHTML = colTasks.length === 0 ?
        '<div class="empty-state"><div class="icon">' + col.emptyIcon + '</div><p>' + col.emptyText + '</p></div>' : '';

      var cardsHTML = colTasks.map(function(t) { return renderCard(t, ci); }).join('');

      return '<div class="column" data-col="' + col.id + '">' +
        '<div class="column-header">' +
          '<span class="column-title">' + escHtml(col.name) + '</span>' +
          '<span class="column-count">' + colTasks.length + '</span>' +
        '</div>' +
        '<div class="column-body" data-col="' + col.id + '">' +
          '<div class="drop-zone" data-col="' + col.id + '"></div>' +
          cardsHTML +
          emptyHTML +
        '</div>' +
        '<button class="add-card-btn" onclick="K.addToCol(\'' + col.id + '\')">' +
          '<span class="plus">+</span> Добавить карточку' +
        '</button>' +
      '</div>';
    }).join('');

    renderTabBadges();
    renderDots();
    setupDragDrop();
  }

  function renderCard(task, colIndex) {
    var t = ensureLabels(task);
    // Labels
    var labelsHTML = '';
    if (t.labels && t.labels.length > 0) {
      labelsHTML = '<div class="card-labels">' +
        t.labels.map(function(l) { return '<div class="card-label ' + l + '"></div>'; }).join('') +
      '</div>';
    }

    // Move buttons
    var prevBtn = colIndex > 0 ?
      '<button class="card-move-btn" onclick="event.stopPropagation();K.move(\'' + t.id + '\',-1)" title="Назад">◂</button>' : '';
    var nextBtn = colIndex < COLUMNS.length - 1 ?
      '<button class="card-move-btn" onclick="event.stopPropagation();K.move(\'' + t.id + '\',1)" title="Вперёд">▸</button>' : '';

    // Description icon
    var descIcon = t.desc ? '<div class="card-badge"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4V5zm0 4h16v2H4V9zm0 4h10v2H4v-2z"/></svg></div>' : '';

    return '<div class="card" draggable="true" data-id="' + t.id + '" onclick="K.edit(\'' + t.id + '\')">' +
      labelsHTML +
      '<div class="card-title">' + escHtml(t.title) + '</div>' +
      '<div class="card-badges">' +
        '<div class="card-badge"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg> ' + formatDate(t.created || Date.now()) + '</div>' +
        descIcon +
        '<div class="card-move-btns">' + prevBtn + nextBtn + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="drop-zone" data-col="' + COLUMNS[colIndex].id + '" data-after="' + t.id + '"></div>';
  }

  // ===== DRAG & DROP =====
  function setupDragDrop() {
    document.querySelectorAll('.card[draggable]').forEach(function(card) {
      var longPressTimer = null;
      var startX, startY;
      var isDragging = false;
      var clone = null;

      card.addEventListener('dragstart', function(e) {
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.id);
        haptic('medium');
      });
      card.addEventListener('dragend', function() {
        card.classList.remove('dragging');
        document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.remove('active'); });
      });

      card.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        longPressTimer = setTimeout(function() {
          isDragging = true;
          card.classList.add('dragging');
          haptic('heavy');
          // Create floating clone
          clone = card.cloneNode(true);
          clone.style.cssText = 'position:fixed;z-index:9000;pointer-events:none;width:' + card.offsetWidth + 'px;opacity:.85;transform:rotate(3deg);box-shadow:0 12px 40px rgba(9,30,66,.35);transition:none;';
          clone.style.left = (startX - card.offsetWidth / 2) + 'px';
          clone.style.top = (startY - 30) + 'px';
          document.body.appendChild(clone);
          document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.add('active'); });
        }, 300);
      }, { passive: true });

      card.addEventListener('touchmove', function(e) {
        if (!isDragging) {
          var dx = Math.abs(e.touches[0].clientX - startX);
          var dy = Math.abs(e.touches[0].clientY - startY);
          if (dx > 8 || dy > 8) clearTimeout(longPressTimer);
          return;
        }
        e.preventDefault();
        var touch = e.touches[0];
        // Move clone
        if (clone) {
          clone.style.left = (touch.clientX - clone.offsetWidth / 2) + 'px';
          clone.style.top = (touch.clientY - 30) + 'px';
        }
        // Highlight drop zones
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        document.querySelectorAll('.drop-zone').forEach(function(dz) {
          dz.classList.remove('active');
          dz.style.borderColor = '';
        });
        if (el && (el.classList.contains('drop-zone') || el.classList.contains('column-body'))) {
          el.classList.add('active');
        }
      }, { passive: false });

      card.addEventListener('touchend', function(e) {
        clearTimeout(longPressTimer);
        if (clone) {
          clone.remove();
          clone = null;
        }
        if (!isDragging) return;
        var touch = e.changedTouches[0];
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el) {
          var colBody = el.closest('.column-body');
          if (colBody) {
            var targetCol = colBody.dataset.col;
            var task = tasks().find(function(t) { return t.id === card.dataset.id; });
            if (task && task.column !== targetCol) {
              task.column = targetCol;
              saveTasks();
              haptic('success');
              showToast('Перемещено в «' + COLUMNS.find(function(c){return c.id===targetCol;}).name + '»');
            }
          }
        }
        card.classList.remove('dragging');
        document.querySelectorAll('.drop-zone').forEach(function(dz) { dz.classList.remove('active'); });
        isDragging = false;
        renderBoard();
      }, { passive: true });
    });

    // Desktop drop zones
    document.querySelectorAll('.drop-zone, .column-body').forEach(function(zone) {
      zone.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('active');
      });
      zone.addEventListener('dragleave', function() { zone.classList.remove('active'); });
      zone.addEventListener('drop', function(e) {
        e.preventDefault();
        zone.classList.remove('active');
        var taskId = e.dataTransfer.getData('text/plain');
        var targetCol = zone.dataset.col || (zone.closest('.column-body') || {}).dataset.col;
        if (taskId && targetCol) {
          var task = tasks().find(function(t) { return t.id === taskId; });
          if (task && task.column !== targetCol) {
            task.column = targetCol;
            saveTasks();
            renderBoard();
            haptic('success');
            showToast('Перемещено в «' + COLUMNS.find(function(c){return c.id===targetCol;}).name + '»');
          }
        }
      });
    });
  }

  // ===== GLOBAL API =====
  window.K = {
    move: function(taskId, dir) {
      var task = tasks().find(function(t) { return t.id === taskId; });
      if (!task) return;
      var ci = COLUMNS.findIndex(function(c) { return c.id === task.column; });
      var ni = ci + dir;
      if (ni < 0 || ni >= COLUMNS.length) return;
      task.column = COLUMNS[ni].id;
      saveTasks();
      renderBoard();
      haptic('select');
      showToast('→ ' + COLUMNS[ni].name);
    },

    edit: function(taskId) {
      var task = tasks().find(function(t) { return t.id === taskId; });
      if (!task) return;
      editingId = taskId;
      $('modalTitle').textContent = escHtml(task.title);
      $('modalSubtitle').textContent = 'в списке «' + (COLUMNS.find(function(c){return c.id===task.column;}) || {}).name + '»';
      $('taskTitle').value = task.title;
      $('taskDesc').value = task.desc || '';
      // Labels
      document.querySelectorAll('#labelsPicker .label-chip').forEach(function(chip) {
        chip.classList.toggle('selected', (task.labels || []).indexOf(chip.dataset.label) >= 0);
      });
      // Priority
      document.querySelectorAll('#priorityPicker button').forEach(function(b) {
        b.classList.toggle('selected', b.dataset.p === task.priority);
      });
      // Column
      document.querySelectorAll('#columnPicker button').forEach(function(b) {
        b.classList.toggle('selected', b.dataset.c === task.column);
      });
      $('modalDelete').style.display = 'block';
      $('columnPickerGroup').style.display = 'block';
      openModal();
      haptic('light');
    },

    addToCol: function(colId) {
      editingId = null;
      resetForm();
      // Pre-select the column
      document.querySelectorAll('#columnPicker button').forEach(function(b) {
        b.classList.toggle('selected', b.dataset.c === colId);
      });
      openModal();
      haptic('light');
    },

    confirmDel: function(taskId) {
      deleteTargetId = taskId;
      var task = tasks().find(function(t) { return t.id === taskId; });
      $('confirmText').textContent = task ? '«' + task.title + '» — это нельзя отменить.' : 'Это нельзя отменить.';
      $('confirmOverlay').classList.add('active');
      haptic('medium');
    }
  };

  // ===== MODAL =====
  function openModal() {
    $('taskModal').classList.add('active');
    setTimeout(function() { $('taskTitle').focus(); }, 300);
  }

  function closeModal() {
    $('taskModal').classList.remove('active');
    editingId = null;
    resetForm();
  }

  function resetForm() {
    $('taskTitle').value = '';
    $('taskDesc').value = '';
    $('modalTitle').textContent = 'Новая задача';
    $('modalSubtitle').textContent = 'Добавить в доску';
    // Reset labels
    document.querySelectorAll('#labelsPicker .label-chip').forEach(function(c) { c.classList.remove('selected'); });
    // Reset priority
    document.querySelectorAll('#priorityPicker button').forEach(function(b) { b.classList.remove('selected'); });
    document.querySelector('#priorityPicker button[data-p="medium"]').classList.add('selected');
    // Reset column
    document.querySelectorAll('#columnPicker button').forEach(function(b) { b.classList.remove('selected'); });
    document.querySelector('#columnPicker button[data-c="backlog"]').classList.add('selected');
    $('modalDelete').style.display = 'none';
  }

  function getSelectedLabels() {
    var labels = [];
    document.querySelectorAll('#labelsPicker .label-chip.selected').forEach(function(c) {
      labels.push(c.dataset.label);
    });
    return labels;
  }

  // ===== EVENT LISTENERS =====

  // Board Tabs
  $('tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.board-tab');
    if (!tab || tab.classList.contains('active')) return;
    document.querySelectorAll('.board-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    activeBoard = tab.dataset.board;
    $('boardName').textContent = BOARD_NAMES[activeBoard] || 'Задачи';
    searchQuery = '';
    $('searchInput').value = '';
    $('searchClear').classList.remove('visible');
    renderBoard();
    $('board').scrollLeft = 0;
    haptic('select');
  });

  // Modal close
  $('modalCancel').onclick = closeModal;
  $('modalClose').onclick = closeModal;
  $('taskModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Labels picker
  $('labelsPicker').addEventListener('click', function(e) {
    var chip = e.target.closest('.label-chip');
    if (!chip) return;
    chip.classList.toggle('selected');
    haptic('select');
  });

  // Priority picker
  $('priorityPicker').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    this.querySelectorAll('button').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    haptic('select');
  });

  // Column picker
  $('columnPicker').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    this.querySelectorAll('button').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    haptic('select');
  });

  // Save
  $('modalSave').onclick = function() {
    var title = $('taskTitle').value.trim();
    if (!title) {
      haptic('error');
      $('taskTitle').style.borderColor = 'var(--label-red)';
      setTimeout(function() { $('taskTitle').style.borderColor = ''; }, 1200);
      return;
    }
    var desc = $('taskDesc').value.trim();
    var priority = (document.querySelector('#priorityPicker .selected') || {}).dataset.p || 'medium';
    var column = (document.querySelector('#columnPicker .selected') || {}).dataset.c || 'backlog';
    var labels = getSelectedLabels();

    if (editingId) {
      var task = tasks().find(function(t) { return t.id === editingId; });
      if (task) {
        task.title = title;
        task.desc = desc;
        task.priority = priority;
        task.column = column;
        task.labels = labels;
        showToast('Обновлено');
      }
    } else {
      tasks().unshift({
        id: genId(),
        title: title,
        desc: desc,
        priority: priority,
        column: column,
        labels: labels,
        created: Date.now()
      });
      showToast('Карточка добавлена');
    }
    saveTasks();
    closeModal();
    renderBoard();
    haptic('success');
  };

  // Delete from modal
  $('modalDelete').onclick = function() {
    if (editingId) {
      closeModal();
      K.confirmDel(editingId);
    }
  };

  // Confirm delete
  $('confirmYes').onclick = function() {
    if (deleteTargetId) {
      boardTasks[activeBoard] = tasks().filter(function(t) { return t.id !== deleteTargetId; });
      saveTasks();
      renderBoard();
      haptic('success');
      showToast('Удалено');
      deleteTargetId = null;
    }
    $('confirmOverlay').classList.remove('active');
  };
  $('confirmNo').onclick = function() {
    $('confirmOverlay').classList.remove('active');
    deleteTargetId = null;
  };
  $('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) { this.classList.remove('active'); deleteTargetId = null; }
  });

  // Search
  var searchDebounce = null;
  $('searchInput').addEventListener('input', function() {
    clearTimeout(searchDebounce);
    var val = this.value;
    // Show/hide clear button
    $('searchClear').classList.toggle('visible', val.length > 0);
    searchDebounce = setTimeout(function() {
      searchQuery = val;
      renderBoard();
    }, 150);
  });

  $('searchClear').onclick = function() {
    $('searchInput').value = '';
    searchQuery = '';
    this.classList.remove('visible');
    renderBoard();
    $('searchInput').focus();
    haptic('light');
  };

  // Refresh
  $('refreshBtn').onclick = function() {
    haptic('light');
    // Force clear all caches
    var cfg = BOARDS[activeBoard];
    localStorage.removeItem(cfg.storageKey);
    localStorage.removeItem(cfg.storageKey + '_ts');
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.removeItem(cfg.storageKey, function() {});
      tg.CloudStorage.removeItem('kanban_bond_v6', function() {}); // Clear old version
    }
    // Force new fetch with unique cache busting
    boardDataHash[activeBoard] = null;
    fetchBoard(activeBoard, function() {
      renderBoard();
      showToast('🔄 Принудительно обновлено');
    });
  };

  // Board scroll → dots
  $('board').addEventListener('scroll', updateDots);

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeModal();
      $('confirmOverlay').classList.remove('active');
    }
  });

  $('taskTitle').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); $('modalSave').click(); }
  });

  // ===== INIT =====
  loadAllBoards(function() {
    isLoading = false;
    $('loadingOverlay').classList.add('hidden');
    setTimeout(function() { $('loadingOverlay').style.display = 'none'; }, 300);
    renderBoard();
    updateDots();
    startAutoRefresh();
  });

})();
</script>
</body>
</html>
